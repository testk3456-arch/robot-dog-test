<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKBU Robot Dog Voice Command Tester</title>
    <style>
        :root {
            --hkbu-blue: #003366;
            --hkbu-gold: #c59b27;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background-color: var(--hkbu-blue);
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .status-badge {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-mic {
            background-color: var(--hkbu-blue);
            color: white;
        }

        .btn-mic:hover {
            background-color: #002244;
        }

        .btn-mic.listening {
            background-color: #d9534f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(217, 83, 79, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(217, 83, 79, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 83, 79, 0); }
        }

        .transcription-box {
            background: var(--card-bg);
            padding: 20px;
            border-top: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .transcription-box h3 {
            margin-top: 0;
            color: var(--hkbu-blue);
        }

        .result-text {
            font-size: 1.2rem;
            min-height: 40px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 15px;
            border: 2px solid transparent;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .card.matched {
            border-color: #5cb85c;
            background-color: #f0fff0;
        }

        .card h4 {
            margin: 0 0 8px 0;
            color: var(--hkbu-blue);
        }

        .keywords {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
        }

        .script-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #444;
            background: #fafafa;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .audio-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .audio-input-group input {
            padding: 6px;
            font-size: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        audio {
            width: 100%;
            height: 32px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HKBU Robot Dog STT Test</h1>
        <span id="stt-status" class="status-badge">STT Ready</span>
    </header>

    <div class="controls">
        <button id="mic-btn" class="btn-mic" onclick="toggleListening()">🎤 Start Listening (Cantonese)</button>
        <div id="listening-state">Click button to speak Cantonese keywords...</div>
    </div>

    <div class="transcription-box">
        <h3>Recognized Speech (STT Result):</h3>
        <div id="transcript" class="result-text">Waiting for input...</div>
    </div>

    <h2>Category 1: Graduate Attributes (GA)</h2>
    <div id="ga-cards" class="grid"></div>

    <h2>Category 2: Generative AI Principles</h2>
    <div id="ai-cards" class="grid"></div>
</div>

<script>
    // --- Data Definition Pre-filled with Google Drive Links ---
   const scriptsData = [
    // Level 1 Intros
    { id: "ga_intro", cat: "ga", title: "📢 Level 1: GA Overview", keywords: ["全人教育", "畢業特質"], text: "...", driveUrl: "level1_ga.mp3" },
    { id: "ai_intro", cat: "ai", title: "📢 Level 1: GenAI Overview", keywords: ["AI 原則", "生成式 AI"], text: "...", driveUrl: "level1_genai.mp3" },

    // GA Items
    { id: "ga1", cat: "ga", title: "1. Citizenship (公民)", keywords: ["公民"], text: "...", driveUrl: "ga_1_citizenship.mp3" },
    { id: "ga2", cat: "ga", title: "2. Knowledge (知識)", keywords: ["知識"], text: "...", driveUrl: "ga_2_knowledge.mp3" },
    { id: "ga3", cat: "ga", title: "3. Learning (學習)", keywords: ["學習"], text: "...", driveUrl: "ga_3_learning.mp3" },
    { id: "ga4", cat: "ga", title: "4. Creativity (創意)", keywords: ["創意"], text: "...", driveUrl: "ga_4_creativity.mp3" },
    { id: "ga5", cat: "ga", title: "5. Communication (溝通)", keywords: ["溝通"], text: "...", driveUrl: "ga_5_communication.mp3" },
    { id: "ga6", cat: "ga", title: "6. Teamwork (群體)", keywords: ["群體"], text: "...", driveUrl: "ga_6_teamwork.mp3" },
    { id: "ga7", cat: "ga", title: "7. Well-being (康健)", keywords: ["康健"], text: "...", driveUrl: "ga_7_wellbeing.mp3" },

    // GenAI Items
    { id: "ai1", cat: "ai", title: "1. AI-Empowering (AI 賦能)", keywords: ["賦能"], text: "...", driveUrl: "ai_1_empowering.mp3" },
    { id: "ai2", cat: "ai", title: "2. AI-Critical (AI 批判)", keywords: ["批判"], text: "...", driveUrl: "ai_2_critical.mp3" },
    { id: "ai3", cat: "ai", title: "3. AI-Ethical (AI 倫理)", keywords: ["倫理"], text: "...", driveUrl: "ai_3_ethical.mp3" },
    { id: "ai4", cat: "ai", title: "4. Build Human Uniqueness (樹立人類獨特性)", keywords: ["獨特性"], text: "...", driveUrl: "ai_4_uniqueness.mp3" }
];

    let recognition = null;
    let isListening = false;

    // --- Helper: Convert Google Drive Link to Direct Stream URL ---
    function formatDriveUrl(url) {
        if (!url) return "";
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
            return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
        return url;
    }

    // --- Render Cards ---
    function renderCards() {
        const gaContainer = document.getElementById('ga-cards');
        const aiContainer = document.getElementById('ai-cards');

        scriptsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${item.id}`;
            const streamUrl = formatDriveUrl(item.driveUrl);

            card.innerHTML = `
                <h4>${item.title}</h4>
                <div class="keywords"><strong>Keywords:</strong> ${item.keywords.join(', ')}</div>
                <div class="script-text">${item.text}</div>
                <div class="audio-input-group">
                    <input type="text" value="${item.driveUrl}" placeholder="Paste Google Drive Link here..." 
                           onchange="updateAudioUrl('${item.id}', this.value)">
                    <audio id="audio-${item.id}" src="${streamUrl}" controls></audio>
                </div>
            `;

            if (item.cat === 'ga') {
                gaContainer.appendChild(card);
            } else {
                aiContainer.appendChild(card);
            }
        });
    }

    function updateAudioUrl(id, rawUrl) {
        const formattedUrl = formatDriveUrl(rawUrl);
        const audioElement = document.getElementById(`audio-${id}`);
        audioElement.src = formattedUrl;
        
        const found = scriptsData.find(item => item.id === id);
        if (found) found.driveUrl = rawUrl;
    }

    // --- Web Speech API (STT Setup) ---
    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            document.getElementById('stt-status').innerText = "STT Not Supported";
            document.getElementById('stt-status').style.backgroundColor = "#d9534f";
            alert("Web Speech API is not supported in this browser. Please use Google Chrome or Microsoft Edge.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'zh-HK'; // Cantonese
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById('mic-btn').classList.add('listening');
            document.getElementById('mic-btn').innerText = "🛑 Stop Listening";
            document.getElementById('listening-state').innerText = "Listening for Cantonese speech...";
        };

        recognition.onend = () => {
            isListening = false;
            document.getElementById('mic-btn').classList.remove('listening');
            document.getElementById('mic-btn').innerText = "🎤 Start Listening (Cantonese)";
            document.getElementById('listening-state').innerText = "Stopped listening.";
        };

        recognition.onresult = (event) => {
            let transcriptText = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcriptText += event.results[i][0].transcript;
            }
            
            document.getElementById('transcript').innerText = transcriptText;
            matchKeywords(transcriptText);
        };

        recognition.onerror = (event) => {
            console.error("Speech Recognition Error: ", event.error);
        };
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    // --- Keyword Matching & Audio Playback Engine ---
    function matchKeywords(text) {
        let matchedItem = null;

        scriptsData.forEach(item => {
            const cardElement = document.getElementById(`card-${item.id}`);
            
            const hasMatch = item.keywords.some(kw => text.toLowerCase().includes(kw.toLowerCase()));

            if (hasMatch) {
                cardElement.classList.add('matched');
                if (!matchedItem) matchedItem = item;
            } else {
                cardElement.classList.remove('matched');
            }
        });

        if (matchedItem) {
            const audioElement = document.getElementById(`audio-${matchedItem.id}`);
            if (audioElement && audioElement.src && audioElement.paused) {
                audioElement.play().catch(e => console.log("Audio playback waiting for user interaction or loading:", e));
            }
        }
    }

    // --- Initialization ---
    window.onload = () => {
        renderCards();
        setupSpeechRecognition();
    };
</script>

</body>
</html>
